name: daily_stock

on:
  schedule:
    # 16:30 KST = 07:30 UTC (월~금 장 마감 후 여유 있게 설정)
    - cron: '30 7 * * 1-5'  
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # 1. 주식 데이터 수집 및 메일 발송 스크립트 실행
      - run: python stock_validator.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      # 2. 수집된 결과(CSV 및 raw 데이터)를 저장소에 자동 커밋하기
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Automated stock data collection: $(date +'%Y-%m-%d')" || exit 0
          git push

      # 3. 실패 시 알림 (가이드 요구사항: Npay 차단 등 실패 시 감지)
      - name: Notify on failure
        if: failure()
        run: |
          echo "GitHub Actions 수집 작업이 실패했습니다. 네이버 증권 IP 차단 여부나 코드를 확인하세요."
          # 필요시 실패 알림용 추가 스크립트나 웹훅 연동 가능
